<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login with Facebook - MusicInfo</title>
  
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Stylesheet -->
  <style media="screen">/* Basic resets */
   /* Basic resets */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #080710;
}

.background {
    width: 430px;
    height: 520px;
    position: absolute;
    transform: translate(-50%, -50%);
    left: 50%;
    top: 50%;
}

.background .shape {
    height: 200px;
    width: 200px;
    position: absolute;
    border-radius: 50%;
}

.shape:first-child {
    background: linear-gradient(#1845ad, #23a2f6);
    left: -80px;
    top: -80px;
}

.shape:last-child {
    background: linear-gradient(to right, #ff512f, #f09819);
    right: -30px;
    bottom: -80px;
}

form {
    height: 520px;
    width: 400px;
    background-color: rgba(255, 255, 255, 0.13);
    position: absolute;
    transform: translate(-50%, -50%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
    padding: 50px 35px;
}


form h3 {
    font-size: 32px;
    font-weight: 500;
    line-height: 42px;
    text-align: center;
}

label {
    display: block;
    margin-top: 30px;
    font-size: 16px;
    font-weight: 500;
}

input {
    display: block;
    height: 50px;
    width: 100%;
    background-color: rgba(255, 255, 255, 0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 300;
}

::placeholder {
    color: #e5e5e5;
}

button {
    margin-top: 50px;
    width: 100%;
    background-color: #ffffff;
    color: #080710;
    padding: 15px 0;
    font-size: 18px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
}

/* Social buttons container */
.social {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px; /* Adds spacing between Google and Facebook */
    color: #080710;
}

/* Google Sign-In Button Container (only layout) */
#g_id_signin {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Facebook button */
.fb {
    background-color: rgba(255, 255, 255, 0.27);
    width: 150px;
    border-radius: 3px;
    padding: 10px;
    color: #eaf0fb;
    text-align: center;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.fb:hover {
    background-color: rgba(255, 255, 255, 0.47);
}

.social i {
    margin-right: 8px;
}

    
  </style>
</head>
<body>

    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <form>
        <h3 style="color: white; ">Login Here</h3>

    <label for="username" style="color: white;">Username</label>
    <input type="text" placeholder="Email or Phone" id="username">

    <label for="password" style="color: white;">Password</label>
    <input type="password" placeholder="Password" id="password">

    <button>Log In</button>
        <div class="social">
            <div id="g_id_signin"></div> <!-- Google button alone -->
            <div class="fb" onclick="facebookLogin()"><i class="fab fa-facebook"></i> Facebook</div>
        </div>
    </form>
    
          

    <!-- Facebook SDK -->
    <div id="fb-root"></div>

    <script>
        const FACEBOOK_APP_ID = '1019177039723550'; // Replace with your Facebook App ID
        const GOOGLE_CLIENT_ID = '307371004730-agc5vlqo0k09lkdi4bt5qos169ish5dr.apps.googleusercontent.com'; // Replace with your Google Client ID
    
        window.fbAsyncInit = function () {
            FB.init({
                appId: FACEBOOK_APP_ID,
                cookie: true,
                xfbml: true,
                version: 'v19.0'
            });
            FB.AppEvents.logPageView();
        };
    
        (function (d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/en_US/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));
    
        // Initialize Google Sign-In
        window.onload = function () {
            // Initialize Google login
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("g_id_signin"),
                { theme: "outline", size: "large" } // Style settings
            );
        };
    
        function facebookLogin() {
            FB.login(function (response) {
                if (response.authResponse) {
                    FB.api('/me', { fields: 'id,name' }, function (userData) {
                        // Save Facebook user data
                        sessionStorage.setItem('fb_name', userData.name);
                        sessionStorage.setItem('fb_id', userData.id);
                        // Redirect to index page
                        window.location.href = "index.html";
                    });
                } else {
                    alert("Facebook login failed or was cancelled.");
                }
            }, { scope: 'public_profile' });
        }
    
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            // Save Google user info
            sessionStorage.setItem('google_name', responsePayload.name);
            sessionStorage.setItem('google_email', responsePayload.email);
            sessionStorage.setItem('google_picture', responsePayload.picture);
            // Redirect to index page
            window.location.href = "index.html";
        }
    
        // Helper function to decode JWT
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(
                atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join('')
            );
            return JSON.parse(jsonPayload);
        }
    </script>    
</body>
</html>
